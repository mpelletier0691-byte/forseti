org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is intentionally disabled. AGP 8.7.x + Hilt's transformation
# phase does not yet round-trip through the configuration cache; enabling it has
# produced "Could not determine a usable local IP" / serialization failures during
# clean builds. Re-enable once we move past Hilt 2.52.
org.gradle.configuration-cache=false

android.useAndroidX=true
# Pdfium-android 1.9.0 (2017) still references com.android.support:* internally.
# Jetifier rewrites those legacy classes to AndroidX at build time, eliminating
# the duplicate-class collision with androidx.core. Slight (<1s) build cost.
android.enableJetifier=true
android.nonTransitiveRClass=true

kotlin.code.style=official
ksp.incremental=true
